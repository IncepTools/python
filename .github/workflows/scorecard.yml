name: scorecard

# OpenSSF Scorecard. It grades the things a consumer cannot see from the
# README: whether releases are signed, whether CI is pinned, whether branch
# protection is on. Published so somebody evaluating this framework does not
# have to take our word for it.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 8 * * 4"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
