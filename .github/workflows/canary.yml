name: canary

# Runs the suite against the *pre-release* versions of the things this
# framework sits on top of. The point is to find out that FastAPI or Pydantic
# has changed something before a user does, on a schedule, rather than in the
# hour after they release it.
#
# A failure here is not a broken build — it is advance notice. It opens an
# issue rather than blocking anybody.

on:
  schedule:
    - cron: "0 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: fastapi and starlette pre-release
            packages: "--prerelease=allow --upgrade-package fastapi --upgrade-package starlette"
          - label: pydantic pre-release
            packages: "--prerelease=allow --upgrade-package pydantic --upgrade-package pydantic-settings"
          - label: sqlalchemy pre-release
            packages: "--prerelease=allow --upgrade-package sqlalchemy"
          - label: python 3.15 release candidate
            python: "3.15"
            packages: ""
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv python install ${{ matrix.python || '3.12' }}

      - run: uv sync --all-extras ${{ matrix.packages }}

      - name: Record what was actually installed
        run: uv pip list

      - run: uv run pytest -q

  report:
    name: open an issue if a canary failed
    needs: upstream
    if: failure() || needs.upstream.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = "Canary failure against upstream pre-releases";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "canary",
            });
            const body = [
              "A scheduled canary run failed against a pre-release of an upstream",
              "dependency. This does not affect released versions.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["canary", "upstream"],
              });
            }
