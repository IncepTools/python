name: pull request

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  title:
    name: conventional title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # The title becomes the squashed commit subject and the changelog draft,
      # so it is worth one check rather than a habit of fixing it afterwards.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The subject "{subject}" must start lower-case and not end with a
            full stop — it is a commit subject, not a sentence.

  dependencies:
    name: dependency review
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # A framework's licence choices become every importer's.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0

  label:
    name: label by path
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
