name: audit

on:
  schedule:
    # Monday morning, so a new advisory is seen at the start of a week rather
    # than discovered during a release.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run --with pip-audit pip-audit --strict
