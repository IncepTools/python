version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # One pull request for the dev tooling; they move together and none of
      # them reach a consumer's dependency graph.
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "httpx", "anyio", "aiosqlite"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
