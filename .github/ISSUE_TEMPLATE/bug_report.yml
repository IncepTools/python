name: Bug report
description: Something behaves differently from what is documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. The three fields below resolve most issues
        on the first reply.

  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened?
      placeholder: |
        I expected a 404 with code PRODUCT_NOT_FOUND.
        I got a 500 with code INTERNAL_ERROR.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Smallest reproduction
      description: >
        A short module with one controller beats a repository. If the failing
        response had a `traceId` and a `code`, include them.
      render: python
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: inceptools version
      description: '`python -c "import inceptools; print(inceptools.VERSION)"`'
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Python, FastAPI and OS
      placeholder: "Python 3.12.4, FastAPI 0.115.0, Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: extras
    attributes:
      label: Which extras are installed?
      placeholder: "sql, redis"

  - type: checkboxes
    id: checked
    attributes:
      label: Before opening this
      options:
        - label: I checked the relevant page under `docs/`
          required: true
        - label: I am on the latest release, or I say above why I cannot be
          required: true
