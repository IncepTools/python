[project]
name = "inceptools"
version = "0.1.0"
description = "An opinionated application framework for Python services, on top of FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "IncepTools" }]
keywords = [
    "fastapi",
    "framework",
    "dependency-injection",
    "modules",
    "asgi",
    "architecture",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115.0",
    "starlette>=0.40.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
server = ["uvicorn[standard]>=0.30.0"]
sql = ["sqlalchemy[asyncio]>=2.0.30", "alembic>=1.13.0"]
redis = ["redis>=5.0.0"]
otel = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
all = [
    "inceptools[server,sql,redis,otel]",
]

[project.urls]
Homepage = "https://github.com/IncepTools/python"
Documentation = "https://inceptools.github.io/python/"
Source = "https://github.com/IncepTools/python"
Changelog = "https://github.com/IncepTools/python/blob/main/CHANGELOG.md"
Issues = "https://github.com/IncepTools/python/issues"
Discussions = "https://github.com/IncepTools/python/discussions"

[dependency-groups]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inceptools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:inceptools.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # FastAPI's whole dependency idiom is a call in a default argument.
    "B008",
    # A mutable class attribute is how a dataclass declares a default factory.
    "RUF012",
    # `class X(str, Enum)` is deliberate: it is the idiom the ecosystem reads,
    # and every use here goes through `.value` so StrEnum would gain nothing.
    "UP042",
    # A multi-line string split into words is more readable than a long list.
    "SIM905",
]

[tool.coverage.run]
source = ["inceptools"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
# A threshold is a floor, not a target. Chasing the last few percent produces
# tests that assert implementation detail and then break on every refactor.
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
    "if __name__ == .__main__.:",
    "# pragma: no cover",
]

[tool.mypy]
python_version = "3.11"
packages = ["inceptools"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = false
